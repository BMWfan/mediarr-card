services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant@sha256:6785d1eca68747a524c156faae1b139ed415c07357386ae6fe17291986e59e82
    restart: unless-stopped
    volumes:
      - ${HA_DEV_RUNTIME_DIR:-./.runtime}/config:/config
    ports:
      - '127.0.0.1:${HA_DEV_PORT:-8124}:8123'
    environment:
      TZ: Europe/Berlin
    healthcheck:
      test: ['CMD', 'python3', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8123/manifest.json', timeout=5)"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s
