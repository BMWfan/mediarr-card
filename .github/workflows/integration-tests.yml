name: Home Assistant integration tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    # Match the OS supported by our pinned Playwright browser build.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install development environment
        run: bash dev/setup.sh
      - name: Install browser system dependencies
        run: dev/node_modules/.bin/playwright install-deps chromium
      - name: Start Home Assistant
        run: bash dev/start.sh
      - name: Record and verify test target
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/dev/.runtime/browsers
        run: |
          git rev-parse HEAD > dev/.runtime/test-commit.txt
          docker compose -p mediarr-card-dev -f dev/compose.yaml exec -T homeassistant \
            python -c "import json; from importlib.metadata import version; from homeassistant.const import __version__; assert __version__ == '2026.11.1', __version__; print(json.dumps({'core': __version__, 'frontend': version('home-assistant-frontend')}))" \
            > dev/.runtime/ha-version.json
          node -e "const {chromium}=require('./dev/node_modules/playwright'); const {execFileSync}=require('node:child_process'); console.log(JSON.stringify({node:process.version,playwright:require('./dev/node_modules/playwright/package.json').version,chromium:execFileSync(process.env.CHROMIUM_PATH || chromium.executablePath(),['--version'],{encoding:'utf8'}).trim()}))" \
            > dev/.runtime/browser-version.json
      - name: Check Home Assistant configuration
        run: docker compose -p mediarr-card-dev -f dev/compose.yaml exec -T homeassistant python -m homeassistant --script check_config --config /config
      - name: Test real Home Assistant frontend
        run: |
          set -o pipefail
          bash dev/test.sh 2>&1 | tee dev/.runtime/test-output.log
      - name: Capture service logs
        if: always()
        run: docker compose -p mediarr-card-dev -f dev/compose.yaml logs --no-color > dev/.runtime/service.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          include-hidden-files: true
          name: homeassistant-test-results
          path: |
            dev/.runtime/test-commit.txt
            dev/.runtime/ha-version.json
            dev/.runtime/browser-version.json
            dev/.runtime/test-output.log
            dev/.runtime/dashboard.png
            dev/.runtime/test-results.json
            dev/.runtime/library-test-results.json
            dev/.runtime/metadata-test-results.json
            dev/.runtime/compact-desktop.png
            dev/.runtime/library-desktop.png
            dev/.runtime/library-mobile.png
            dev/.runtime/library-cast-scroll-desktop.png
            dev/.runtime/catalog-full-page.png
            dev/.runtime/full-library-download.png
            dev/.runtime/cinema-*.png
            dev/.runtime/service.log
      - name: Stop development instance
        if: always()
        run: docker compose -p mediarr-card-dev -f dev/compose.yaml down
