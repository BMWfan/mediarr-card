name: Validate Mediarr Card

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check mediarr-card.js
      - name: Build HACS bundle
        run: bash scripts/build-single-file.sh
      - name: Verify committed bundle matches sources
        run: git diff --exit-code -- mediarr-card.js
