name: Validate Mediarr Card

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check mediarr-card.js
      - name: Build HACS bundle
        run: bash scripts/build-single-file.sh
      - name: Verify committed bundle matches sources
        run: git diff --exit-code -- mediarr-card.js
