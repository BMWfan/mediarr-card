name: Quality and security
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install pinned Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - name: Scan tracked checkout (redacted, no history or production access)
        run: gitleaks dir . --redact=100 --no-banner --exit-code 1
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Audit locked browser dependencies without running install scripts
        run: npm audit --prefix dev --package-lock-only --audit-level=low
      - name: Check all tracked JavaScript syntax
        run: git ls-files -z '*.js' '*.mjs' | xargs -0 -r -n 1 node --check
      - name: Test model and frontend contract adapters
        run: node --test tests/*.test.mjs
